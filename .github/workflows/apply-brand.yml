name: apply-brand
on:
  push:
    paths:
      - ".github/workflows/apply-brand.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last good index and apply brand
        run: |
          git checkout 90459e7447a219e2a4054a4d88598bbfaa219c37 -- index.html
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          old_fonts = '<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;600&family=Russo+One&family=Zeyada&display=swap" rel="stylesheet">'
          new_fonts = '<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;600&family=Zeyada&display=swap" rel="stylesheet">'
          if old_fonts not in t:
              raise SystemExit('fonts link missing')
          t = t.replace(old_fonts, new_fonts)
          t = t.replace(
          ''' :root, html[data-theme="dark"] {\n color-scheme: dark;\n --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a0a0a0; --line: #333; --lift: #242424;\n --librus: #6aa84f; --doutrina: #3c78d8; --centro: #cc0000; --shklr: #cfcfcf;\n --bar: #000; --bar-fg: #fff; --border: #444;\n --sans: "Quicksand", system-ui, sans-serif;\n''',
          ''' :root, html[data-theme="dark"] {\n color-scheme: dark;\n --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a0a0a0; --line: #333; --lift: #242424;\n --librus: #6aa84f; --doutrina: #3c78d8; --centro: #cc0000; --shklr: #c4b5fd; --brand: #c4b5fd;\n --bar: #000; --bar-fg: #fff; --border: #444;\n --sans: "Quicksand", system-ui, sans-serif;\n --serif: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;\n'''
          )
          t = t.replace('--shklr: #444;', '--shklr: #7c3aed; --brand: #7c3aed;')
          t = t.replace('font-family: Inter, system-ui, sans-serif;', 'font-family: var(--serif);')
          t = t.replace('.logo-mark { width: 1.15em; height: 1.15em; color: #cc0000; }', '.logo-mark { width: 1.15em; height: 1.15em; color: var(--brand); stroke-width: 3.5; }')
          t = t.replace('h2 { font-size: 0.78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 2.2rem 0 .7rem; }', 'h2 { font-family: var(--sans); font-size: 0.78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 2.2rem 0 .7rem; }')
          t = t.replace('.card strong { display: block; font-size: 1rem; }', '.card strong { display: block; font-family: var(--sans); font-size: 1rem; }')
          t = t.replace('footer.notes { margin-top: 2.5rem; color: var(--muted); font-size: .82rem; text-align: center; }', '.legal { font-size: .72rem; line-height: 1.45; color: var(--muted); }\n footer.notes { margin-top: 2.5rem; color: var(--muted); font-size: .7rem; text-align: center; }')
          t = t.replace('#mast .library-mark { width: 56px; height: 56px; color: #cc0000; display: flex; align-items: center; justify-content: center; }', '#mast .library-mark { width: 56px; height: 56px; color: var(--brand); display: flex; align-items: center; justify-content: center; }')
          t = t.replace('<h2>Notas</h2>\n <p>Sem fins lucrativos.', '<h2>Notas</h2>\n <p class="legal">Sem fins lucrativos.')
          t = t.replace('<p>O texto franc\u00eas de Allan Kardec', '<p class="legal">O texto franc\u00eas de Allan Kardec')
          t = t.replace('<p>Este site n\u00e3o det\u00e9m direitos', '<p class="legal">Este site n\u00e3o det\u00e9m direitos')
          t = t.replace('<h2>Notes</h2>\n <p>Not for profit.', '<h2>Notes</h2>\n <p class="legal">Not for profit.')
          t = t.replace('<p>Allan Kardec', '<p class="legal">Allan Kardec')
          t = t.replace('<p>This site claims no rights', '<p class="legal">This site claims no rights')
          old_lucide = 'if (window.lucide) lucide.createIcons({ attrs: { "stroke-width": 2.5 } });'
          new_lucide = old_lucide + '\n document.querySelectorAll(".logo-mark").forEach((el) => el.setAttribute("stroke-width", "3.5"));'
          if old_lucide not in t:
              raise SystemExit('lucide line missing')
          t = t.replace(old_lucide, new_lucide)
          if t.count('--brand') < 3:
              raise SystemExit('brand token missing')
          if 'var(--serif)' not in t:
              raise SystemExit('serif missing')
          p.write_text(t, encoding='utf-8')
          print('ok', len(t))
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Brand purple, Source Serif body, thicker mark, smaller Notes
          file_pattern: index.html
