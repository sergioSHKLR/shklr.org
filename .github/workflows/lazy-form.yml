name: lazy-form
on:
  push:
    paths:
      - ".github/workflows/lazy-form.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Defer contact iframe src
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          url = 'https://docs.google.com/forms/d/e/1FAIpQLSc7ZRs6usX8DhTixnerMX68QtRT0o-bz9PmTtn8OKK0z2vhsw/viewform?embedded=true'
          old_iframe = f'<iframe title="Contact form" src="{url}"></iframe>'
          new_iframe = f'<iframe id="contact-frame" title="Contact form" data-src="{url}"></iframe>'
          if 'id="contact-frame"' in t and 'data-src=' in t and 'contact-frame' in t[t.find('function openContact'):t.find('function openContact')+800]:
              print('already patched')
          else:
              if old_iframe not in t:
                  raise SystemExit('iframe anchor missing')
              t = t.replace(old_iframe, new_iframe, 1)
              old_open = '''function openContact() {
      if (settings.classList.contains("is-open")) closeSettings();
      scrim.hidden = false;
      contact.hidden = false;'''
              new_open = '''function openContact() {
      if (settings.classList.contains("is-open")) closeSettings();
      const frame = document.getElementById("contact-frame");
      if (frame && !frame.getAttribute("src")) frame.src = frame.dataset.src || "";
      scrim.hidden = false;
      contact.hidden = false;'''
              if old_open not in t:
                  raise SystemExit('openContact anchor missing')
              t = t.replace(old_open, new_open, 1)
              p.write_text(t, encoding='utf-8')
              print('patched', t.count('contact-frame'), 'bytes', len(t))
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Load Google Form only when Mensagem opens
          file_pattern: index.html
