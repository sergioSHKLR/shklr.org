name: wire-pdf-preview
on:
  push:
    paths:
      - scripts/patch_assets.py
      - .github/workflows/wire-pdf-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last good index if needed
        run: |
          if grep -q PLACEHOLDER index.html || ! grep -q 'class="thumb"' index.html; then
            git checkout bba96eb16ac8e236cdc77a36ec19e10a5ddd1f03 -- index.html
          fi
          python3 scripts/patch_assets.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Icon-only downloads, PDF preview, poster PNG modal
          file_pattern: index.html
