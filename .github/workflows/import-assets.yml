name: import-assets
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-assets.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files from pt.shklr.org
        run: |
          set -euo pipefail
          mkdir -p images framework/pdf
          base=https://pt.shklr.org
          curl -fL --retry 5 -o images/us-round.jpg "$base/images/us-round.jpg"
          curl -fL --retry 5 -o framework/preces.png "$base/framework/preces.png"
          curl -fL --retry 5 -o framework/obras-basicas.png "$base/framework/obras-basicas.png"
          curl -fL --retry 5 -o framework/protector.png "$base/framework/protector.png"
          curl -fL --retry 5 -o framework/anguish.png "$base/framework/anguish.png"
          curl -fL --retry 5 -o framework/pdf/preces.pdf "$base/framework/pdf/preces.pdf"
          curl -fL --retry 5 -o framework/pdf/obras-basicas.pdf "$base/framework/pdf/obras-b%C3%A1sicas.pdf"
          curl -fL --retry 5 -o framework/pdf/protector-portrait.pdf "$base/framework/pdf/protector-portrait.pdf"
          curl -fL --retry 5 -o framework/pdf/anguish-portrait.pdf "$base/framework/pdf/anguish-portrait.pdf"
          ls -lh images framework framework/pdf
      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images framework
          if git diff --cached --quiet; then
            echo "No new files"
          else
            git commit -m "Import images and PDFs from pt.shklr.org"
            git push
          fi
