name: import-assets
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-assets.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dest
      - uses: actions/checkout@v4
        with:
          repository: sergioSHKLR/pt.shklr.org
          path: src
      - name: Copy media
        run: |
          set -euo pipefail
          mkdir -p dest/images dest/framework/pdf
          cp src/images/us-round.jpg dest/images/us-round.jpg
          cp src/framework/preces.png dest/framework/preces.png
          cp src/framework/obras-basicas.png dest/framework/obras-basicas.png
          cp src/framework/protector.png dest/framework/protector.png
          cp src/framework/anguish.png dest/framework/anguish.png
          cp src/framework/pdf/preces.pdf dest/framework/pdf/preces.pdf
          cp "src/framework/pdf/obras-básicas.pdf" dest/framework/pdf/obras-basicas.pdf
          cp src/framework/pdf/protector-portrait.pdf dest/framework/pdf/protector-portrait.pdf
          cp src/framework/pdf/anguish-portrait.pdf dest/framework/pdf/anguish-portrait.pdf
          ls -lh dest/images dest/framework dest/framework/pdf
      - name: Commit imported files
        working-directory: dest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images framework
          if git diff --cached --quiet; then
            echo "No new files"
          else
            git commit -m "Import images and PDFs from pt.shklr.org"
            git push
          fi
