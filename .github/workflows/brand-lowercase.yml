name: brand-lowercase
on:
  push:
    paths:
      - ".github/workflows/brand-lowercase.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase brand and bar title
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          t = t.replace('</i> SHKLR</p>', '</i> shklr</p>')
          t = t.replace('</i> SHKLR</span>', '</i> shklr</span>')
          p.write_text(t)
          assert '</i> shklr</p>' in t
          assert '</i> shklr</span>' in t
          print('ok')
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Lowercase brand and bar title to shklr
          file_pattern: index.html
