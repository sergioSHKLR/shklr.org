name: family-header
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/family-header.yml"
      - "scripts/patch_header.py"
permissions:
  contents: write
jobs:
  header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_header.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Match family header and enlarge shklr brand
          file_pattern: index.html
