name: family-header
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/family-header.yml"
permissions:
  contents: write
jobs:
  header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch header
        run: python3 -c "import re,pathlib; p=pathlib.Path('index.html'); t=p.read_text(); css='\\n#mast{box-sizing:border-box;width:100%;margin:0;padding:1.5rem 1.25rem 1.25rem;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.35rem;border-bottom:1px solid var(--line);font-family:var(--sans)}html[data-theme=dark] #mast{background:#111;color:#f0f0f0;border-bottom-color:#333}@media (prefers-color-scheme:dark){html[data-theme=sys] #mast{background:#111;color:#f0f0f0;border-bottom-color:#333}}#mast .library-mark{width:56px;height:56px;color:#cc0000;display:flex;align-items:center;justify-content:center}#mast .library-mark svg{width:56px;height:56px}#mast h1{margin:0;font-family:var(--sans);font-size:1.5rem;font-weight:700;letter-spacing:.12em;line-height:1.2}#mast .library-cta{margin:0;font-size:.9rem;color:#555;font-weight:400}html[data-theme=dark] #mast .library-cta{color:#a0a0a0}@media (prefers-color-scheme:dark){html[data-theme=sys] #mast .library-cta{color:#a0a0a0}}#bar-title{font-size:1rem;letter-spacing:.1em}\\n'; t=t.replace('[hidden] { display: none !important; }','[hidden] { display: none !important; }'+css) if '#mast{' not in t and '#mast {' not in t else t; new='<header id=\"mast\"><div class=\"library-mark\" aria-hidden=\"true\"><i data-lucide=\"circle\" class=\"logo-mark\"></i></div><h1 id=\"brand\"><span>shklr</span></h1><p class=\"library-cta\" id=\"tagline-pt\">Projeto independente \u2014 n\\u00e3o \\u00e9 entidade registrada</p><p class=\"library-cta\" id=\"tagline-en\" hidden>Independent project \u2014 not a registered entity</p></header>'; t2=re.sub(r'<header>\\s*<p id=\"brand\">.*?</header>','HEADER_PLACE',t,count=1,flags=re.S);\nassert 'HEADER_PLACE' in t2, 'header missing'; t=t2.replace('HEADER_PLACE', new); t=re.sub(r'#brand \\{[^}]+\\}','',t,count=1); p.write_text(t); print('ok', 'mast' in t)"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Match family header and enlarge shklr brand
          file_pattern: index.html
